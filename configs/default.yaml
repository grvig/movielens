# Single source of truth for every run in this project.
#
# Nothing outside this file sets a seed, a split ratio or a hyperparameter.  If a number
# here changes, every CSV in results/ has to be regenerated.

seed: 20260903

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  fits_dir: data/processed/fits
  results_dir: results
  figures_dir: figures

download:
  url: https://files.grouplens.org/datasets/movielens/ml-100k.zip
  md5_url: https://files.grouplens.org/datasets/movielens/ml-100k.zip.md5
  archive_name: ml-100k.zip
  md5: 0e33842e24a9c977be4e0107933c0723
  extract_subdir: ml-100k
  # SHA-256 of the certificate files.grouplens.org served on 2026-09-04, recorded because
  # that certificate expired on 2026-08-28 and had not been renewed. Used only by
  # --allow-expired-cert, which requires this exact certificate and ignores the expiry
  # date, rather than disabling verification and accepting anything at all.
  # Delete this and drop the flag once GroupLens renews.
  certificate_sha256: "964d10cca0e47c190e5fd2e9159330750767b584feeacac67cbe925a91447555"

# Per-user temporal split.  A random row split leaks future interactions into training and
# inflates every metric; see results/split_ablation.csv for how much.
split:
  train_frac: 0.7
  val_frac: 0.1
  test_frac: 0.2
  min_train_ratings: 5

evaluation:
  k_values: [5, 10, 20]
  relevance_threshold: 4.0
  rating_min: 1.0
  rating_max: 5.0

features:
  document_parts: [genres, title_tokens, decade]
  min_df: 2
  sublinear_tf: true

models:
  global_mean: {}
  user_mean:
    shrinkage: 10.0
  item_mean:
    shrinkage: 10.0
  most_popular: {}
  content:
    calibration_scale: 1.0
  # Selected on validation RMSE from results/tuning_knn.csv.
  item_knn:
    neighbourhood_size: 40
    shrinkage: 10.0
    centering: item
    # Regularises the base term the same way item_mean does. Without it, items with a
    # single 5.0 rating dominate every top-k list.
    mean_shrinkage: 10.0
  # Selected on validation precision@10 from the same sweep. It is 0.115 worse on RMSE and
  # 46 percent better on precision, and it lands on the other centring convention. Kept as
  # a separate model so the trade-off is a row in the results table, not a footnote.
  item_knn_ranking:
    neighbourhood_size: 5
    shrinkage: 0.0
    centering: user
    mean_shrinkage: 10.0
  # Selected on validation RMSE from results/tuning_mf.csv.
  mf:
    n_factors: 32
    learning_rate: 0.01
    regularisation: 0.1
    n_epochs: 60
    patience: 5
    init_scale: 0.1
  # Selected on validation precision@10 from the same sweep. Weaker regularisation: across
  # the grid, stronger L2 buys RMSE and costs ranking.
  mf_ranking:
    n_factors: 16
    learning_rate: 0.005
    regularisation: 0.005
    n_epochs: 60
    patience: 5
    init_scale: 0.1
  # Density-weighted blend of content and matrix factorisation. The curve is fitted on
  # validation by run_hybrid and copied here by hand; w(n) = sigmoid(a + b*log(1+n)) is
  # the share given to the content model for a user with n training ratings.
  hybrid:
    curve_intercept: 1.9691
    curve_slope: -0.55
    # Fingerprint of the component settings these constants were fitted against.
    # Retune content or mf and building the hybrid fails until run_hybrid is redone.
    components: 746a47cf212e03e3
  # Fixed-weight blend at the point on the validation frontier that buys the most coverage
  # for at most 0.02 RMSE against the pure collaborative end.
  hybrid_frontier:
    fixed_weight: 0.4
    components: 746a47cf212e03e3
