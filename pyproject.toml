[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movielens-comparison"
version = "0.1.0"
description = "Four recommender families compared under one evaluation protocol on MovieLens 100K"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = [
    "src",
    "src.data",
    "src.models",
    "src.evaluation",
    "src.experiments",
    "src.plots",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
